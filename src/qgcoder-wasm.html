<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>QGCoder</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #00003b;
            color: #ffa700;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
        }
        /* Hide Qt's default "Qt for WebAssembly" loading screen */
        #qt-loading,
        .qt-loading,
        #qt-logo,
        .qt-logo,
        #qt-loading-overlay,
        .qt-loading-overlay {
            display: none !important;
            visibility: hidden !important;
        }
        #qgcoder-loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #00003b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #qgcoder-loading {
            width: 420px;
            height: 24px;
            border: 2px solid #ffa700;
            box-sizing: border-box;
            margin-top: 32px;
            overflow: hidden;
        }
        #qgcoder-progress {
            width: 0%;
            height: 100%;
            background: #ffa700;
            transition: width 0.05s ease-out;
        }
        #qgcoder-loading-text {
            margin-top: 14px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
    </style>
    <script>
        // window.qtConfig must be a global property set BEFORE qtloader.js loads,
        // since Qt reads it at script load time.
        window.qtConfig = {
            run: 'qgcoder',
            onLoadingProgress: function(progress) {
                var bar = document.getElementById('qgcoder-progress');
                var txt = document.getElementById('qgcoder-loading-text');
                if (bar) bar.style.width = Math.round(progress * 100) + '%';
                if (txt) txt.textContent = 'Loading QGCoder\u2026 ' + Math.round(progress * 100) + '%';
            }
        };

        // Fallback: simulate progress if qtloader never reports real progress.
        // Stops at 95% so it's clear this is simulated, not complete.
        var fallbackProgress = 0;
        window.__qgcoderFallbackTimer = setInterval(function() {
            if (fallbackProgress < 95) {
                fallbackProgress += 1;
                var bar = document.getElementById('qgcoder-progress');
                var txt = document.getElementById('qgcoder-loading-text');
                if (bar) bar.style.width = fallbackProgress + '%';
                if (txt) txt.textContent = 'Loading QGCoder\u2026 ' + fallbackProgress + '%';
            }
        }, 50);

        // Poll for Qt's canvas: when qtloader finishes loading the app it
        // creates a full-screen canvas. Hide our overlay so the app shows.
        setInterval(function() {
            var canvas = document.querySelector('canvas');
            if (canvas) {
                clearInterval(window.__qgcoderFallbackTimer);
                window.__qgcoderFallbackTimer = null;
                var overlay = document.getElementById('qgcoder-loading-overlay');
                if (overlay) overlay.style.display = 'none';
            }
        }, 100);
    </script>
    <script src="qtloader.js"></script>
</head>
<body>
    <div id="qgcoder-loading-overlay">
        <div id="qgcoder-loading">
            <div id="qgcoder-progress"></div>
        </div>
        <div id="qgcoder-loading-text">Loading QGCoder\u2026 0%</div>
    </div>
</body>
</html>
