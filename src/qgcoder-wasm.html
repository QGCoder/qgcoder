<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>QGCoder</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #00003b;
            color: #ffa700;
            font-family: "Courier New", Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* Hide Qt's default "Qt for WebAssembly" loading screen */
        #qt-loading,
        .qt-loading,
        #qt-logo,
        .qt-logo,
        #qt-loading-overlay,
        .qt-loading-overlay {
            display: none !important;
            visibility: hidden !important;
        }
        #qgcoder-loading {
            width: 420px;
            height: 24px;
            border: 2px solid #ffa700;
            box-sizing: border-box;
            margin-top: 32px;
            overflow: hidden;
            position: relative;
            z-index: 10000;
        }
        #qgcoder-progress {
            width: 0%;
            height: 100%;
            background: #ffa700;
            transition: width 0.05s ease-out;
        }
        #qgcoder-loading-text {
            margin-top: 14px;
            font-size: 14px;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 10000;
        }
    </style>
    <script>
        // window.qtConfig must be set as a global property BEFORE qtloader.js loads,
        // since Qt reads it at script load time.
        window.qtConfig = {
            run: 'qgcoder',
            onLoadingProgress: function(progress) {
                var bar = document.getElementById('qgcoder-progress');
                var txt = document.getElementById('qgcoder-loading-text');
                if (bar) bar.style.width = Math.round(progress * 100) + '%';
                if (txt) txt.textContent = 'Loading QGCoder\u2026 ' + Math.round(progress * 100) + '%';
                // Stop the fallback timer once Qt starts reporting real progress
                if (window.__qgcoderFallbackTimer) {
                    clearInterval(window.__qgcoderFallbackTimer);
                    window.__qgcoderFallbackTimer = null;
                }
            }
        };

        // Fallback: if qtloader never reports progress, simulate it so the user
        // sees something happening while the WASM module loads.
        var fallbackProgress = 0;
        window.__qgcoderFallbackTimer = setInterval(function() {
            if (fallbackProgress < 90) {
                fallbackProgress += 2;
                var bar = document.getElementById('qgcoder-progress');
                var txt = document.getElementById('qgcoder-loading-text');
                if (bar) bar.style.width = fallbackProgress + '%';
                if (txt) txt.textContent = 'Loading QGCoder\u2026 ' + fallbackProgress + '%';
            }
        }, 200);
    </script>
    <script src="qtloader.js"></script>
</head>
<body>
    <div id="qgcoder-loading">
        <div id="qgcoder-progress"></div>
    </div>
    <div id="qgcoder-loading-text">Loading QGCoder\u2026 0%</div>
</body>
</html>
