<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>QGCoder</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #00003b;
            color: #ffa700;
            font-family: "Courier New", Courier, monospace;
        }
        /* Hide Qt's default "Qt for WebAssembly" loading screen */
        #qt-loading, .qt-loading, #qt-logo, .qt-logo {
            display: none !important;
            visibility: hidden !important;
        }
        /* Small loading bar at top center - does not block the app */
        #qgcoder-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
        }
        #qgcoder-track {
            width: 420px;
            height: 24px;
            border: 2px solid #ffa700;
            box-sizing: border-box;
            overflow: hidden;
        }
        #qgcoder-fill {
            width: 0%;
            height: 100%;
            background: #ffa700;
            transition: width 0.05s ease-out;
        }
        #qgcoder-text {
            margin-top: 10px;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
    <script>
        // Set before qtloader.js loads
        window.qtConfig = {
            run: 'qgcoder',
            onLoadingProgress: function(p) {
                var f = document.getElementById('qgcoder-fill');
                var t = document.getElementById('qgcoder-text');
                if (f) f.style.width = Math.round(p * 100) + '%';
                if (t) t.textContent = 'Loading QGCoder\u2026 ' + Math.round(p * 100) + '%';
            }
        };

        var done = false;
        function end() {
            if (done) return;
            done = true;
            clearInterval(window.__qgcFb);
            window.__qgcFb = null;
            var b = document.getElementById('qgcoder-bar');
            if (b) b.style.display = 'none';
        }

        // Fallback progress
        var fp = 0;
        window.__qgcFb = setInterval(function() {
            if (fp < 100) {
                fp += 1;
                var f = document.getElementById('qgcoder-fill');
                var t = document.getElementById('qgcoder-text');
                if (f) f.style.width = fp + '%';
                if (t) t.textContent = 'Loading QGCoder\u2026 ' + fp + '%';
            } else {
                setTimeout(end, 300);
                clearInterval(window.__qgcFb);
                window.__qgcFb = null;
            }
        }, 50);

        // Detect when Qt's canvas appears
        setInterval(function() {
            if (done) return;
            if (document.querySelector('canvas')) end();
        }, 100);

        // Guaranteed end after 8 seconds
        setTimeout(end, 8000);
    </script>
    <script src="qtloader.js"></script>
</head>
<body>
    <div id="qgcoder-bar">
        <div id="qgcoder-track">
            <div id="qgcoder-fill"></div>
        </div>
        <div id="qgcoder-text">Loading QGCoder\u2026 0%</div>
    </div>
</body>
</html>
