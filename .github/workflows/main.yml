on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - ubuntu-24.04
    runs-on: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v7

    - name: Install devscripts
      run: |
        sudo cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources~
        sudo sed -Ei 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt -qq -y install devscripts equivs lintian

    - name: Build source package
      env:
        DEBFULLNAME: "Github Actions"
        DEBEMAIL: "jakob.flierl@gmail.com"
      run: |
        export TARGET=$(. /etc/lsb-release && echo $DISTRIB_CODENAME)
        git fetch --unshallow
        git fetch --tags
        VERSION="$(git tag -l | tail -n1 | sed -e "s/^v//" -e "s/-/+git/")"
        dch --create \
            --distribution ${TARGET} \
            --package qgcoder \
            --newversion ${VERSION}~${TARGET}1 \
            "Automatic build from Github"
        debuild -S -sa -us -uc -d

    - name: Build and install libqgcodeeditor
      env:
        DEBFULLNAME: "Jakob Flierl"
        DEBEMAIL: "jakob.flierl@gmail.com"
      run: |
        git clone https://github.com/QGCoder/libqgcodeeditor
        pushd libqgcodeeditor
        export TARGET=$(. /etc/lsb-release && echo $DISTRIB_CODENAME)
        VERSION="$(git tag -l | tail -n1 | sed -e "s/^v//" -e "s/-/+git/")"
        dch --create \
            --distribution ${TARGET} \
            --package libqgcodeeditor \
            --newversion ${VERSION}~${TARGET}1 \
            "Automatic build from Github"
        debuild -S -sa -us -uc -d
        sudo apt-get update -qq
        sudo mk-build-deps --install --tool "apt-get --yes --no-install-recommends"
        dpkg-buildpackage -b -rfakeroot -us -uc
        sudo dpkg -i ../libqgcodeeditor*deb
        sudo apt -y -f install
        popd

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo mk-build-deps --install --tool "apt-get --yes --no-install-recommends"
    
    - name: Build binary package
      run: dpkg-buildpackage -b -rfakeroot -us -uc

    - name: Install binary package
      run: sudo dpkg -i ../qgcoder*deb

    - name: Install binary package dependencies
      run: sudo apt -f install

    - name: Run lintian
      run: lintian ../qgcoder*deb | lintian-info

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}
        if-no-files-found: error
        path: |
          *.buildinfo
          *.changes
          *.dsc
          *.tar.*
          *.deb
          ~/**/*/*.buildinfo
          ~/**/*/*.changes
          ~/**/*/*.dsc
          ~/**/*/*.tar.*
          ~/**/*/*.deb

  windows:
    name: windows-latest (mingw64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v7

    # MinGW rather than MSVC: this is the same GCC the Ubuntu job uses, so the
    # only things that can break here are real portability problems, and the
    # result needs no Visual C++ redistributable.
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        install: git
        pacboy: >-
          cc:p
          cmake:p
          ninja:p
          qt6-base:p

    - name: Build and install libqgcodeeditor
      run: |
        # There is no .deb to install from here, so build the editor widget
        # straight into a staging prefix. Static, so nothing extra to ship.
        git clone --depth 1 https://github.com/QGCoder/libqgcodeeditor
        cmake -S libqgcodeeditor -B libqgcodeeditor/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(pwd -W)/qgcodeeditor-prefix" \
            -DBUILD_STATIC_LIB=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DESIGNER_PLUGIN=OFF
        cmake --build libqgcodeeditor/build
        cmake --install libqgcodeeditor/build

    - name: Build qgcoder
      run: |
        cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(pwd -W)/qgcodeeditor-prefix"
        cmake --build build

    - name: Deploy qgcoder
      run: |
        # Installing also runs windeployqt, via qt_generate_deploy_app_script().
        # It leaves the exe and the Qt DLLs in dist/bin and the Qt plugins in
        # dist/plugins, with a dist/bin/qt.conf tying the two together.
        cmake --install build --prefix "$(pwd -W)/dist"
        # windeployqt only knows about Qt, not about the toolchain's own runtime
        cp /mingw64/bin/libgcc_s_seh-1.dll \
           /mingw64/bin/libstdc++-6.dll \
           /mingw64/bin/libwinpthread-1.dll \
           dist/bin/

    - name: Check that the binary runs
      run: ./dist/bin/qgcoder.exe --version

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-mingw64
        if-no-files-found: error
        path: dist
