name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - ubuntu-24.04
    runs-on: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v7

    - name: Install devscripts
      run: |
        sudo cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources~
        sudo sed -Ei 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt -qq -y install devscripts equivs lintian

    - name: Build libqgcodeeditor package
      env:
        DEBFULLNAME: "Jakob Flierl"
        DEBEMAIL: "jakob.flierl@gmail.com"
      run: |
        git clone https://github.com/QGCoder/libqgcodeeditor
        pushd libqgcodeeditor
        export TARGET=$(. /etc/lsb-release && echo $DISTRIB_CODENAME)
        git fetch --tags
        VERSION="$(git tag -l | tail -n1 | sed -e "s/^v//" -e "s/-/+git/")"
        DEBEMAIL="${DEBEMAIL}" dch --create \
            --distribution ${TARGET} \
            --package libqgcodeeditor \
            --newversion ${VERSION}~${TARGET}1 \
            "Automatic release build"
        sudo mk-build-deps --install --tool "apt-get --yes --no-install-recommends"
        dpkg-buildpackage -b -rfakeroot -us -uc
        popd

    - name: Install libqgcodeeditor
      run: |
        # dpkg-buildpackage writes the real packages to the parent of the
        # source dir, i.e. the workspace root. The only .deb left inside
        # libqgcodeeditor/ is the mk-build-deps metapackage, so globbing there
        # installed that instead and left libqgcodeeditor-qt6-dev missing,
        # which made qgcoder's build-deps unsatisfiable.
        sudo dpkg -i libqgcodeeditor*.deb
        sudo apt -y -f install

    - name: Build qgcoder package
      env:
        DEBFULLNAME: "Jakob Flierl"
        DEBEMAIL: "jakob.flierl@gmail.com"
      run: |
        export TARGET=$(. /etc/lsb-release && echo $DISTRIB_CODENAME)
        VERSION="$(git tag -l | tail -n1 | sed -e "s/^v//" -e "s/-/+git/")"
        DEBEMAIL="${DEBEMAIL}" dch --create \
            --distribution ${TARGET} \
            --package qgcoder \
            --newversion ${VERSION}~${TARGET}1 \
            "Automatic release build"
        sudo apt-get update -qq
        sudo dpkg --configure -a
        sudo apt-get -f install -y
        sudo mk-build-deps --install --tool "apt-get --yes --no-install-recommends"
        dpkg-buildpackage -b -rfakeroot -us -uc

    - name: Upload artifacts
      run: |
        mkdir -p artifacts
        cp *.buildinfo *.changes *.dsc *.tar.* *.deb artifacts/ 2>/dev/null || true
        cp ../*.buildinfo ../*.changes ../*.dsc ../*.tar.* ../*.deb artifacts/ 2>/dev/null || true
        cp libqgcodeeditor/*.buildinfo libqgcodeeditor/*.changes libqgcodeeditor/*.dsc libqgcodeeditor/*.tar.* libqgcodeeditor/*.deb artifacts/ 2>/dev/null || true

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}
        if-no-files-found: error
        path: artifacts

  # The GitHub-hosted runners only run Ubuntu, so the other .deb flavours are
  # built inside the target distribution's own container image, with the
  # workspace mounted read-write at /build and the packages collected in
  # artifacts/ for the host to upload. Debian 12-14 are the three Debian
  # releases still in maintenance as of 2026 (oldstable, stable and testing).
  build-deb:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-bookworm, image: debian:bookworm }
          - { name: debian-trixie, image: debian:trixie }
          - { name: debian-forky, image: debian:forky }
          - { name: ubuntu-26.04, image: ubuntu:26.04 }
    steps:
    - uses: actions/checkout@v7

    - name: Build the packages
      env:
        DEBFULLNAME: "Jakob Flierl"
        DEBEMAIL: "jakob.flierl@gmail.com"
      run: |
        # The target distribution's own packages (qt6-base-dev, debhelper,
        # ...) are only resolvable inside its container. --rm since the job
        # else leaves the image's default entrypoint process behind.
        docker run --rm \
            -e DEBFULLNAME -e DEBEMAIL \
            -v "$GITHUB_WORKSPACE":/build -w /build \
            "${{ matrix.image }}" bash /build/.github/scripts/build-deb.sh

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        if-no-files-found: error
        path: artifacts

  # The same job CI runs on every push; on a tag its DMG becomes a release
  # asset. Artifacts a called workflow uploads belong to this run, so the
  # release job downloads it along with the rest.
  build-macos:
    uses: ./.github/workflows/macos.yml

  # The same job CI runs on every push; on a tag its installer becomes a
  # release asset.
  build-windows:
    uses: ./.github/workflows/windows.yml

  release:
    name: Release
    needs: [build, build-deb, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: '*'
        path: artifacts
        merge-multiple: true

    - name: Drop the debug-symbol packages
      # dh_strip builds a *-dbgsym .deb per flavour. Nobody installs those from
      # a release page and they are some of the largest files, so leave them on
      # the run's artifact page but do not publish them with the release.
      run: find artifacts -maxdepth 1 -name '*-dbgsym_*' -delete

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
