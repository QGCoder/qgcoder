name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - ubuntu-24.04
    runs-on: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v7

    - name: Install devscripts
      run: |
        sudo cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources~
        sudo sed -Ei 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt -qq -y install devscripts equivs lintian

    - name: Build libqgcodeeditor package
      env:
        DEBFULLNAME: "Jakob Flierl"
        DEBEMAIL: "jakob.flierl@gmail.com"
      run: |
        git clone https://github.com/QGCoder/libqgcodeeditor
        pushd libqgcodeeditor
        export TARGET=$(. /etc/lsb-release && echo $DISTRIB_CODENAME)
        git fetch --tags
        VERSION="$(git tag -l | tail -n1 | sed -e "s/^v//" -e "s/-/+git/")"
        DEBEMAIL="${DEBEMAIL}" dch --create \
            --distribution ${TARGET} \
            --package libqgcodeeditor \
            --newversion ${VERSION}~${TARGET}1 \
            "Automatic release build"
        sudo mk-build-deps --install --tool "apt-get --yes --no-install-recommends"
        dpkg-buildpackage -b -rfakeroot -us -uc
        popd

    - name: Install libqgcodeeditor
      run: |
        # dpkg-buildpackage writes the real packages to the parent of the
        # source dir, i.e. the workspace root. The only .deb left inside
        # libqgcodeeditor/ is the mk-build-deps metapackage, so globbing there
        # installed that instead and left libqgcodeeditor-qt6-dev missing,
        # which made qgcoder's build-deps unsatisfiable.
        sudo dpkg -i libqgcodeeditor*.deb
        sudo apt -y -f install

    - name: Build qgcoder package
      env:
        DEBFULLNAME: "Jakob Flierl"
        DEBEMAIL: "jakob.flierl@gmail.com"
      run: |
        export TARGET=$(. /etc/lsb-release && echo $DISTRIB_CODENAME)
        VERSION="$(git tag -l | tail -n1 | sed -e "s/^v//" -e "s/-/+git/")"
        DEBEMAIL="${DEBEMAIL}" dch --create \
            --distribution ${TARGET} \
            --package qgcoder \
            --newversion ${VERSION}~${TARGET}1 \
            "Automatic release build"
        sudo apt-get update -qq
        sudo dpkg --configure -a
        sudo apt-get -f install -y
        sudo mk-build-deps --install --tool "apt-get --yes --no-install-recommends"
        dpkg-buildpackage -b -rfakeroot -us -uc

    - name: Upload artifacts
      run: |
        mkdir -p artifacts
        cp *.buildinfo *.changes *.dsc *.tar.* *.deb artifacts/ 2>/dev/null || true
        cp ../*.buildinfo ../*.changes ../*.dsc ../*.tar.* ../*.deb artifacts/ 2>/dev/null || true
        cp libqgcodeeditor/*.buildinfo libqgcodeeditor/*.changes libqgcodeeditor/*.dsc libqgcodeeditor/*.tar.* libqgcodeeditor/*.deb artifacts/ 2>/dev/null || true

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}
        if-no-files-found: error
        path: artifacts

  # The GitHub-hosted runners only run Ubuntu, so the other .deb flavours are
  # built inside the target distribution's own container image, with the
  # workspace mounted read-write at /build and the packages collected in
  # artifacts/ for the host to upload. Debian 12-14 are the three Debian
  # releases still in maintenance as of 2026 (oldstable, stable and testing).
  build-deb:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-bookworm, image: debian:bookworm }
          - { name: debian-trixie, image: debian:trixie }
          - { name: debian-forky, image: debian:forky }
          - { name: ubuntu-26.04, image: ubuntu:26.04 }
    steps:
    - uses: actions/checkout@v7

    - name: Build the packages
      env:
        DEBFULLNAME: "Jakob Flierl"
        DEBEMAIL: "jakob.flierl@gmail.com"
      run: |
        # The target distribution's own packages (qt6-base-dev, debhelper,
        # ...) are only resolvable inside its container. --rm since the job
        # else leaves the image's default entrypoint process behind.
        docker run --rm \
            -e DEBFULLNAME -e DEBEMAIL \
            -v "$GITHUB_WORKSPACE":/build -w /build \
            "${{ matrix.image }}" bash /build/.github/scripts/build-deb.sh

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        if-no-files-found: error
        path: artifacts

  build-macos:
    name: macos-universal
    # Big Sur (macOS 11) needs Qt 6.7, and linking Qt 6.7 on the newer macOS
    # 26 SDK fails because its FindWrapOpenGL.cmake still wants the AGL
    # framework, which that SDK no longer ships. macos-latest points at macOS
    # 26 now, so pin the job to macos-15, whose SDK still has AGL.
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7

    # The official Qt builds for macOS are universal, so one DMG covers both
    # Apple Silicon and Intel. Homebrew's Qt is single-architecture.
    #
    # Pinned to the 6.7 line: it is the newest Qt whose official binaries run
    # on macOS 11 (Big Sur, the oldest release qgcoder supports); Qt 6.8
    # raised the macOS floor to 12, and 6.10 requires 13.
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.*'
        host: mac
        target: desktop
        arch: clang_64
        cache: true

    - name: Build and install libqgcodeeditor
      run: |
        # No .deb to install from here, so build the editor widget into a
        # staging prefix. Static, so nothing extra ends up in the bundle.
        git clone --depth 1 https://github.com/QGCoder/libqgcodeeditor
        cmake -S libqgcodeeditor -B libqgcodeeditor/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/qgcodeeditor-prefix" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_STATIC_LIB=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DESIGNER_PLUGIN=OFF
        cmake --build libqgcodeeditor/build -j"$(sysctl -n hw.ncpu)"
        cmake --install libqgcodeeditor/build

    - name: Build the application icon
      run: |
        # icons/qgcoder.png is 256x256; the larger entries are upscaled so the
        # Finder has something at every size it asks for.
        mkdir -p qgcoder.iconset
        for size in 16 32 128 256 512; do
          sips -z $size $size icons/qgcoder.png \
               --out "qgcoder.iconset/icon_${size}x${size}.png" >/dev/null
          sips -z $((size * 2)) $((size * 2)) icons/qgcoder.png \
               --out "qgcoder.iconset/icon_${size}x${size}@2x.png" >/dev/null
        done
        iconutil --convert icns qgcoder.iconset --output icons/qgcoder.icns

    - name: Build qgcoder
      run: |
        cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$PWD/qgcodeeditor-prefix"
        cmake --build build -j"$(sysctl -n hw.ncpu)"

    - name: Package the disk image
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        # installing also runs macdeployqt, via qt_generate_deploy_app_script()
        cmake --install build --prefix "$PWD/dist"
        # There is no Developer ID certificate here, so the bundle is only
        # ad-hoc signed: arm64 refuses to load anything unsigned at all, and
        # Gatekeeper still asks the user to confirm the first launch.
        codesign --force --deep --sign - dist/qgcoder.app
        lipo -archs dist/qgcoder.app/Contents/MacOS/qgcoder
        mkdir -p dmg
        cp -R dist/qgcoder.app dmg/
        ln -s /Applications dmg/Applications
        mkdir -p artifacts
        hdiutil create -volname "QGCoder ${VERSION}" \
            -srcfolder dmg -ov -format UDZO \
            "artifacts/qgcoder-${VERSION}-macos-universal.dmg"

    - uses: actions/upload-artifact@v7
      with:
        name: macos-universal
        if-no-files-found: error
        path: artifacts

  build-windows:
    name: windows-mingw64
    # MinGW rather than MSVC: the same GCC the Ubuntu job uses, so the only
    # things that can break here are real portability problems, and the result
    # needs no Visual C++ redistributable.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v7

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        install: git
        pacboy: >-
          cc:p
          cmake:p
          ninja:p
          qt6-base:p
          nsis:p

    - name: Build and install libqgcodeeditor
      run: |
        git clone --depth 1 https://github.com/QGCoder/libqgcodeeditor
        cmake -S libqgcodeeditor -B libqgcodeeditor/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(pwd -W)/qgcodeeditor-prefix" \
            -DBUILD_STATIC_LIB=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DESIGNER_PLUGIN=OFF
        cmake --build libqgcodeeditor/build
        cmake --install libqgcodeeditor/build

    - name: Build qgcoder
      run: |
        cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(pwd -W)/qgcodeeditor-prefix"
        cmake --build build

    - name: Deploy qgcoder
      run: |
        cmake --install build --prefix "$(pwd -W)/dist"
        # windeployqt only knows about Qt, not about the toolchain's own
        # runtime; copy the three DLLs by hand.
        cp /mingw64/bin/libgcc_s_seh-1.dll \
           /mingw64/bin/libstdc++-6.dll \
           /mingw64/bin/libwinpthread-1.dll \
           dist/bin/

    - name: Check that the binary runs
      run: ./dist/bin/qgcoder.exe --version

    - name: Verify the Qt runtime is complete
      run: |
        # --version above never loads the Qt GUI plugins, so make sure the
        # pieces the installer will ship really are there: the qt.conf that
        # ties the plugin path to the install prefix, the QPA platform plugin
        # without which the window will not open, and every Qt/MinGW DLL the
        # installer packs into bin\.
        test -f dist/bin/qt.conf
        test -f dist/share/qt6/plugins/platforms/qwindows.dll
        for dll in Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll \
                   Qt6OpenGL.dll Qt6OpenGLWidgets.dll Qt6Network.dll \
                   libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
          test -f "dist/bin/$dll"
        done
        echo "Qt runtime complete"

    - name: Build the installer
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p artifacts
        cd installer
        makensis -DVERSION="$VERSION" qgcoder.nsi
        mv "qgcoder-${VERSION}-windows-installer.exe" ../artifacts/

    - uses: actions/upload-artifact@v7
      with:
        name: windows-mingw64
        if-no-files-found: error
        path: artifacts

  release:
    name: Release
    needs: [build, build-deb, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: '*'
        path: artifacts
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
